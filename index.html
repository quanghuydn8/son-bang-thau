<!doctype html>
<!-- Trang Bảng thầu (spec 02 mục "Trang Bảng thầu cho Sơn", bản mẫu B, ticket 17): khung tĩnh, KHÔNG chứa dữ liệu,
     KHÔNG tự suy luận — chỉ vẽ những gì cổng thầu soạn sẵn (tom_tat, may_da_bo, nhom_hien_thi, mot_dong, bang_kiem).
     Dữ liệu lấy từ Edge Function cong-thau bằng mã bí mật sau dấu # của link (không gửi lên máy chủ GitHub Pages).
     Bản gốc ở repo Son/bang-thau/; bản chạy ở repo công khai son-bang-thau (GitHub Pages).
     Máy tính: hai cột (danh sách | chi tiết). Điện thoại (≤ 720px): tóm tắt + Nên làm + Cần anh xem; mở gói = chỉ dòng ❌/❓. -->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Bảng thầu</title>
  <style>
    :root {
      color-scheme: light dark;
      --nen: #f6f7f9; --the: #fff; --chu: #1c2430; --phu: #556070; --vien: #dfe3e9;
      --xanh: #146c43; --xanh-nen: #e3f3ea; --vang: #8a5600; --vang-nen: #fff2d6; --vang-vien: #d99a1c;
      --do: #b3261e; --do-nen: #fde8e7; --xam-nen: #eceff3; --nhan: #1f55c0; --chon: #e9efff; --giai: #f3f6ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --nen: #121417; --the: #1b1e23; --chu: #e8eaed; --phu: #a3abb6; --vien: #30353d;
        --xanh: #6cd39a; --xanh-nen: #173826; --vang: #f0c060; --vang-nen: #3a2d12; --vang-vien: #b7862a;
        --do: #ff8f86; --do-nen: #43201e; --xam-nen: #262a31; --nhan: #8db4ff; --chon: #1d2a45; --giai: #1a2133;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--nen); color: var(--chu);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--nhan); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    /* Hai cột: trái danh sách, phải chi tiết gói đang chọn. */
    .hai { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; height: 100vh; height: 100dvh; }
    .trai { overflow-y: auto; border-right: 1px solid var(--vien); padding: 16px 14px 40px; }
    .phai { overflow-y: auto; padding: 24px 28px 80px; background: var(--the); }
    h1 { font-size: 21px; margin: 2px 4px 8px; }
    .tab { display: flex; gap: 6px; margin: 0 4px 10px; }
    .tab button { padding: 4px 12px; border-radius: 99px; border: 1px solid var(--vien); background: var(--the); }
    .tab button[aria-selected="true"] { border-color: var(--nhan); color: var(--nhan); font-weight: 600; }
    .ngay { display: flex; gap: 6px; align-items: center; margin: 0 4px 12px; }
    .ngay button, .ngay input { padding: 3px 9px; border: 1px solid var(--vien); border-radius: 6px; background: var(--the); }
    .tomtat { background: var(--the); border: 1px solid var(--vien); border-radius: 10px; padding: 12px 14px;
      font-size: 15.5px; margin-bottom: 6px; }
    .bao { background: var(--the); border: 1px solid var(--vien); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
    .bao.loi { border-color: var(--do); color: var(--do); }
    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--phu); margin: 18px 4px 6px; }
    details.nhom > summary { cursor: pointer; list-style: none; }
    details.nhom > summary::-webkit-details-marker { display: none; }
    details.nhom > summary h3 { display: inline-block; }
    details.nhom > summary h3::after { content: " ▸"; color: var(--nhan); }
    details.nhom[open] > summary h3::after { content: " ▾"; }
    .muc { padding: 9px 11px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
    .muc:hover { background: var(--the); border-color: var(--vien); }
    .muc.chon { background: var(--chon); border-color: var(--nhan); }
    .muc.nen_lam { border-left: 4px solid var(--xanh); } .muc.can_xem { border-left: 4px solid var(--vang-vien); }
    .muc .ten { font-size: 14px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; }
    .muc .ly { font-size: 13px; color: var(--phu); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; }
    .muc .dt-them { display: none; }
    .muc .ma { font-size: 12px; color: var(--phu); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .tim { display: block; width: 100%; box-sizing: border-box; margin: 0 0 12px; padding: 6px 10px;
      border: 1px solid var(--vien); border-radius: 8px; background: var(--the); }
    .muc[hidden], .nhom-ds[hidden], details.nhom[hidden] { display: none; }
    .cuoi { margin-top: 28px; color: var(--phu); font-size: 13px; border-top: 1px solid var(--vien); padding: 10px 4px 0; }
    .sua { font-size: 12px; color: var(--vang); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
    .co-do { color: var(--do); font-weight: 600; font-size: 13px; margin-top: 3px; }
    .sua-doi { margin-top: 8px; font-size: 14px; } .sua-doi.co-do { font-size: 14.5px; }
    details.ban-cu { margin-top: 10px; background: var(--nen); border-radius: 8px; padding: 8px 12px; }
    details.ban-cu summary { cursor: pointer; color: var(--nhan); }

    /* Chi tiết gói */
    .chip { display: inline-block; border-radius: 6px; padding: 1px 9px; font-size: 13px; font-weight: 600; }
    .chip.nen_lam { background: var(--xanh-nen); color: var(--xanh); }
    .chip.can_xem { background: var(--vang-nen); color: var(--vang); }
    .chip.khong_dat { background: var(--do-nen); color: var(--do); }
    .chip.khong_doi, .chip.ngoai { background: var(--xam-nen); color: var(--phu); }
    .chip.ai { background: var(--xam-nen); color: var(--chu); }
    .nut-ai { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .nut-ai button { border: 1px solid var(--vien); background: var(--the); border-radius: 7px; padding: 4px 14px; }
    .nut-ai button:disabled { opacity: .55; cursor: default; }
    .nut-ai .tt { color: var(--phu); font-size: 13px; }
    .goi-y-ai { font-size: 13px; color: var(--phu); margin-top: 3px; }
    .khoi-ai { margin-top: 10px; } .toan-van { white-space: pre-wrap; font-size: 14px; margin-top: 6px; }
    .phai .ten-goi { font-size: 20px; font-weight: 600; margin-top: 6px; }
    .meta { color: var(--phu); font-size: 13.5px; margin-top: 2px; }
    .gap { color: var(--do); font-weight: 600; }
    .mot-dong { margin-top: 10px; font-size: 16px; }
    .mot-dong.can_xem::before { content: "👉 "; }
    .mot-dong.nen_lam::before { content: "✓ "; color: var(--xanh); font-weight: 700; }
    .mot-dong.khong_dat::before { content: "✗ "; color: var(--do); font-weight: 700; }
    .ph { display: flex; gap: 6px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .ph button { border: 1px solid var(--vien); background: var(--the); border-radius: 7px; padding: 4px 14px; }
    .ph button.chon { border-color: var(--nhan); color: var(--nhan); font-weight: 600; background: var(--chon); }
    .ph input { flex: 1 1 200px; min-width: 0; padding: 4px 8px; border: 1px solid var(--vien); border-radius: 7px;
      background: var(--the); }
    .ph .tt { width: 100%; font-size: 12.5px; color: var(--phu); }
    .ph .tt.loi { color: var(--do); }
    .kt-khung { margin-top: 16px; border-top: 1px dashed var(--vien); padding-top: 12px; overflow-x: auto; }
    table.kt { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.kt th, table.kt td { border-bottom: 1px solid var(--vien); padding: 7px 8px; text-align: left; vertical-align: top; }
    table.kt th { font-weight: 600; color: var(--phu); font-size: 13px; background: var(--nen); }
    table.kt td.o { cursor: pointer; white-space: nowrap; }
    table.kt td.o:hover { background: var(--chon); }
    table.kt td.o.mo { background: var(--chon); outline: 1px solid var(--nhan); }
    .dau-dat { color: var(--xanh); } .dau-khong { color: var(--do); } .dau-hoi { color: var(--vang); } .dau-gach { color: var(--phu); }
    .giai { background: var(--giai); border: 1px solid var(--vien); border-radius: 8px; padding: 10px 12px; margin: 4px 0;
      font-size: 13.5px; white-space: pre-line; }
    .giai .ng { color: var(--phu); font-size: 12.5px; margin-top: 6px; }
    table.con { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; white-space: normal; }
    table.con th, table.con td { border-bottom: 1px solid var(--vien); padding: 4px 6px; text-align: left; }
    table.con th { color: var(--phu); font-weight: 600; }
    details.nv { margin-top: 3px; font-size: 13px; }
    details.nv summary { color: var(--nhan); cursor: pointer; }
    details.nv .trich { background: var(--nen); border-radius: 6px; padding: 8px 10px; margin-top: 4px; white-space: pre-wrap; }
    details.nv img { max-width: 100%; border: 1px solid var(--vien); border-radius: 6px; margin-top: 6px; }
    .ghi { color: var(--phu); font-size: 13px; margin-top: 10px; }
    .dong-x { display: none; }

    /* Điện thoại: bản gọn. Một cột; chi tiết gói phủ toàn màn hình. */
    @media (max-width: 720px) {
      .hai { display: block; height: auto; }
      .trai { border: none; padding: 14px 14px 60px; }
      .phai { position: fixed; inset: 0; padding: 14px 14px 80px; z-index: 20; }
      .phai.trong { display: none; }
      .dong-x { display: inline-block; float: right; border: none; background: var(--xam-nen); border-radius: 8px;
        padding: 4px 12px; }
      .muc { background: var(--the); border-color: var(--vien); padding: 12px; margin-bottom: 8px; }
      .muc .ten { -webkit-line-clamp: 3; font-size: 15px; }
      .muc .ly { -webkit-line-clamp: 4; font-size: 14px; color: var(--chu); }
      .muc.nho .ly { display: none; }
      .muc .dt-them { display: block; }
      .nv { display: none !important; }
      .phai .ten-goi { font-size: 17px; }
      /* Bảng kiểm xếp chồng: nhãn yêu cầu rồi mỗi công ty một dòng "QB: ❓ …". */
      table.kt, table.kt tbody, table.kt tr, table.kt td { display: block; width: 100%; }
      table.kt tr:first-child { display: none; }
      table.kt td { border: none; padding: 3px 4px; }
      table.kt td:first-child { font-weight: 600; padding-top: 10px; border-top: 1px solid var(--vien); }
      table.kt td.o { white-space: normal; }
      table.kt td.o::before { content: attr(data-ct) ": "; color: var(--phu); }
      table.kt tr.giai-dong td { border: none; font-weight: 400; }
    }
  </style>
</head>
<body>
<div class="hai">
  <div class="trai">
    <h1>Bảng thầu</h1>
    <div class="tab" role="tablist">
      <button id="tab-ngay" role="tab" aria-selected="true">Theo ngày</button>
      <button id="tab-chon" role="tab" aria-selected="false">Đã chọn làm</button>
    </div>
    <div class="ngay" id="chon-ngay-hang">
      <button id="truoc" aria-label="Ngày trước">‹</button>
      <input id="chon-ngay" type="date" aria-label="Chọn ngày">
      <button id="sau" aria-label="Ngày sau">›</button>
    </div>
    <input id="tim" class="tim" type="search" placeholder="Tìm mã gói (IB…), tên, tỉnh — trong 30 ngày" aria-label="Tìm gói">
    <div id="ds"><div class="bao">Đang tải…</div></div>
  </div>
  <div class="phai trong" id="ct"></div>
</div>
<script>
  // Địa chỉ cổng thầu (không bí mật). Mã bí mật nằm trong link: #ngay=YYYY-MM-DD&k=<mã>[&goi=<mã>-<pb>][&xem=chon].
  const CONG = "https://jfflejpfkxwlpxqryksb.supabase.co/functions/v1/cong-thau";
  const TEN_NHOM = { nen_lam: "Nên làm", can_xem: "Cần anh xem", khong_doi: "Không đòi năng lực",
    khong_dat: "Không đạt", ngoai: "Không phải hàng của mình" };
  const THU_TU = Object.keys(TEN_NHOM);
  const TEN_PH = { lam: "Làm", bo: "Bỏ", may_sai: "Máy sai" };
  const LOP_DAU = { "✅": "dau-dat", "❌": "dau-khong", "❓": "dau-hoi", "—": "dau-gach" };
  const $ = (id) => document.getElementById(id);
  const thoat = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const laDienThoai = () => matchMedia("(max-width: 720px)").matches;
  const khoa = (g) => `${g.ma_tbmt}-${g.phien_ban}`;
  // Tìm không cần gõ dấu: "son la" khớp "Sơn La".
  const boDau = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[đĐ]/g, "d").toLowerCase();

  // ── Trạng thái trang
  let dsGoi = [];          // gói đang hiện ở cột trái (theo ngày hoặc đã chọn làm)
  const chiTiet = {};      // khóa gói → dữ liệu /goi đã tải
  let dangMo = null;       // khóa gói đang hiện ở cột phải

  function docHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    return { ngay: p.get("ngay"), k: p.get("k"), xem: p.get("xem"), goi: p.get("goi") };
  }
  function datHash(them) {
    const v = { ...docHash(), ...them };
    const p = new URLSearchParams({ k: v.k ?? "" });
    for (const t of ["ngay", "xem", "goi"]) if (v[t]) p.set(t, v[t]);
    location.hash = p.toString();
  }
  async function goiCong(duong, than) {
    const res = await fetch(`${CONG}${duong}`, {
      method: than ? "POST" : "GET",
      headers: { "x-ma-bi-mat": docHash().k, ...(than ? { "content-type": "application/json" } : {}) },
      body: than ? JSON.stringify(than) : undefined,
    });
    if (res.status === 401) throw new Error("Mã trong link không đúng. Mở lại link trong tin Telegram.");
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.loi ?? `Máy chủ trả lỗi ${res.status}.`);
    return j;
  }

  // ── Chữ nhỏ
  const homNayVN = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  function congNgay(ngay, n) {
    const d = new Date(ngay + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const tien = (v) => v >= 1e9 ? `${(v / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 2 })} tỷ`
    : `${Math.round(v / 1e6).toLocaleString("vi-VN")} triệu`;
  const gia = (g) => g.gia?.length ? g.gia.map(tien).join(" · ") : "không rõ giá";
  const ddmm = (s) => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
  const conNgay = (g) => Math.round((Date.parse(g.han_dong.slice(0, 10)) - Date.parse(homNayVN())) / 864e5);
  function han(g) {
    const n = conNgay(g);
    const chu = n < 0 ? "đã đóng" : n === 0 ? "đóng hôm nay" : `còn ${n} ngày`;
    return `đóng ${thoat(ddmm(g.han_dong))} ${thoat(g.han_dong.slice(11, 16))} <span class="${n <= 7 ? "gap" : ""}">(${chu})</span>`;
  }
  const noi = (g) => (g.dia_diem ?? []).map((d) => d.replace(/^(Tỉnh|Thành phố)\s+/, "")).join(", ");
  const lucVN = (iso) => new Date(Date.parse(iso) + 7 * 3600e3).toISOString();
  const linkHoSo = (g) => "https://muasamcong.mpi.gov.vn/web/guest/contractor-selection?" + new URLSearchParams({
    p_p_id: "egpportalcontractorselectionv2_WAR_egpportalcontractorselectionv2", p_p_lifecycle: "0",
    p_p_state: "normal", p_p_mode: "view",
    _egpportalcontractorselectionv2_WAR_egpportalcontractorselectionv2_render: "detail-v2",
    type: "es-notify-contractor", stepCode: "notify-contractor-step-1-tbmt", id: g.id_tbmt, notifyId: g.id_tbmt,
    processApply: g.quy_trinh || "LDT", notifyNo: g.ma_tbmt, step: "tbmt", isInternet: g.qua_mang === false ? "0" : "1",
    bidForm: g.hinh_thuc ?? "",
  });

  // ── Cột trái
  // ngayQuet: chỉ có khi thẻ nằm trong kết quả tìm mọi ngày — ghi "quét dd/mm", bấm thì chuyển sang ngày đó.
  function mucGoi(g, chon, ngayQuet) {
    const k = g.nhom_hien_thi ?? "can_xem";
    const chinh = k === "nen_lam" || k === "can_xem";
    const sua = g.phien_ban !== "00" ? ` <span class="sua">sửa đổi ${thoat(g.phien_ban)}</span>` : "";
    const tim = boDau([g.ma_tbmt, g.ten, noi(g), g.ben_moi].join(" "));
    return `<div class="muc ${k} ${chinh ? "" : "nho"} ${chon ? "chon" : ""}" tabindex="0" role="button" data-goi="${thoat(khoa(g))}" data-tim="${thoat(tim)}"${ngayQuet ? ` data-ngay="${thoat(ngayQuet)}"` : ""}>
      <div class="ten">${thoat(g.ten)}${sua}</div>
      <div class="ma">${thoat(g.ma_tbmt)}${ngayQuet ? ` · quét ${thoat(ddmm(ngayQuet))}` : ""}</div>
      <div class="ly">${thoat(g.mot_dong ?? "Máy chưa đọc xong gói này")}</div>
      ${g.sua_doi?.co_do ? `<div class="co-do">🚩 ${thoat(g.sua_doi.cau)}</div>` : ""}
      ${g.danh_gia_ai && !g.danh_gia_ai.nang ? `<div class="goi-y-ai">Gợi ý AI: ${thoat(g.danh_gia_ai.mot_dong)}</div>` : ""}
      ${chinh ? `<div class="dt-them"><div class="meta">${han(g)}</div>${nutPhanHoi(g, { gon: true })}</div>` : ""}
    </div>`;
  }

  // Bản cũ đã có bản sửa đổi trong cùng ngày: cổng đánh dấu, trang không hiện (bản mới có khung "Bản trước").
  const goiHien = (du) => (du.goi ?? []).filter((g) => g.qua && !g.da_co_ban_moi);

  function veDanhSach(du) {
    const ds = $("ds");
    const p = du.phien;
    if (!p) { ds.innerHTML = `<div class="tomtat">${thoat(du.tom_tat ?? "Ngày này chưa quét.")}</div>`; return []; }
    const bao = p.trang_thai === "dang_chay" ? `<div class="bao">Lần quét mới nhất đang chạy…</div>`
      : p.trang_thai === "loi" ? `<div class="bao loi">Lần quét mới nhất bị lỗi: ${thoat(p.ly_do_loi)}. Anh bấm quét lại.</div>` : "";
    const qua = goiHien(du);
    const nhom = Object.fromEntries(THU_TU.map((k) => [k, qua.filter((g) => (g.nhom_hien_thi ?? "can_xem") === k)]));
    // Cần anh xem: hạn đóng gần nhất lên đầu.
    nhom.can_xem.sort((a, b) => a.han_dong.localeCompare(b.han_dong));
    const dt = laDienThoai();
    const chon = docHash().goi;
    let h = `${bao}<div class="tomtat">${thoat(du.tom_tat)}</div>`;
    for (const k of THU_TU) {
      const d = nhom[k];
      if (!d.length) continue;
      const muc = d.map((g) => mucGoi(g, !dt && khoa(g) === chon)).join("");
      // Máy tính: thu gọn Không đạt + Không phải hàng của mình. Điện thoại: chỉ mở Nên làm + Cần anh xem.
      const thuGon = dt ? !(k === "nen_lam" || k === "can_xem") : (k === "khong_dat" || k === "ngoai");
      const tieuDe = `<h3>${TEN_NHOM[k]} (${d.length})</h3>`;
      h += thuGon ? `<details class="nhom"><summary>${tieuDe}</summary>${muc}</details>` : `<div class="nhom-ds">${tieuDe}${muc}</div>`;
    }
    if (du.may_da_bo) h += `<div class="cuoi">${thoat(du.may_da_bo)}</div>`;
    ds.innerHTML = h;
    return THU_TU.flatMap((k) => nhom[k]);
  }

  /** Lọc thẻ gói đang vẽ ở cột trái (mã, tên, tỉnh, bên mời) — dùng cho tab Đã chọn làm. Nhóm thu gọn có gói
   *  khớp thì mở ra; xóa chữ tìm thì nhóm đó đóng lại như cũ. */
  function locTim() {
    const q = boDau($("tim").value.trim());
    const ds = $("ds");
    ds.querySelector(".khong-thay")?.remove();
    let thay = 0;
    for (const m of ds.querySelectorAll(".muc")) {
      m.hidden = !!q && !m.dataset.tim.includes(q);
      if (!m.hidden) thay++;
    }
    for (const n of ds.querySelectorAll(".nhom-ds, details.nhom")) {
      const co = [...n.querySelectorAll(".muc")].some((m) => !m.hidden);
      n.hidden = !!q && !co;
      if (n.tagName === "DETAILS") {
        if (q && co && !n.open) { n.open = true; n.dataset.moTim = "1"; }
        if (!q && n.dataset.moTim) { n.open = false; delete n.dataset.moTim; }
      }
    }
    if (q && !thay && ds.querySelector(".muc")) {
      ds.insertAdjacentHTML("beforeend", `<div class="bao khong-thay">Không thấy gói nào khớp "${thoat($("tim").value.trim())}" trong danh sách này.</div>`);
    }
  }

  // ── Tìm mọi ngày (tab Theo ngày): trang không đọc DB, chỉ hỏi được cổng thầu "/bang?ngay=" từng ngày →
  // tải 30 ngày gần nhất (6 ngày một lúc), giữ 2 phút để gõ tiếp không tải lại, lọc ở trình duyệt.
  const SO_NGAY_TIM = 30;
  const boNho = new Map(); // ngày → { luc, hua }
  function taiNgay(n) {
    const c = boNho.get(n);
    if (c && Date.now() - c.luc < 120e3) return c.hua;
    const hua = goiCong(`/bang?ngay=${n}`);
    boNho.set(n, { luc: Date.now(), hua });
    hua.catch(() => boNho.delete(n));
    return hua;
  }
  async function chayGioiHan(ds, soLuong, f) {
    const kq = [];
    let i = 0;
    await Promise.all(Array.from({ length: soLuong }, async () => {
      while (i < ds.length) { const j = i++; kq[j] = await f(ds[j]).catch(() => null); }
    }));
    return kq;
  }
  let lanTim = 0; // gõ liên tục: chỉ kết quả của lần tìm mới nhất được vẽ
  async function timMoiNgay() {
    const chu = $("tim").value.trim();
    const q = boDau(chu);
    const lan = ++lanTim;
    daTai = "tim";
    const ds = $("ds");
    ds.innerHTML = `<div class="bao">Đang tìm trong ${SO_NGAY_TIM} ngày gần nhất…</div>`;
    const ngays = Array.from({ length: SO_NGAY_TIM }, (_, i) => congNgay(homNayVN(), -i));
    const kq = await chayGioiHan(ngays, 6, taiNgay);
    if (lan !== lanTim) return;
    const thay = [];
    const da = new Set();
    let hong = 0;
    ngays.forEach((n, i) => {
      if (!kq[i]) { hong++; return; }
      for (const g of goiHien(kq[i])) {
        // Một gói quét nhiều ngày → giữ lần quét mới nhất (ngày duyệt từ hôm nay lùi về).
        if (da.has(khoa(g)) || !boDau([g.ma_tbmt, g.ten, noi(g), g.ben_moi].join(" ")).includes(q)) continue;
        da.add(khoa(g));
        thay.push({ g, n });
      }
    });
    dsGoi = thay.map((x) => x.g);
    const dt = laDienThoai();
    const chon = docHash().goi;
    ds.innerHTML = `<div class="tomtat">Tìm "${thoat(chu)}" trong ${SO_NGAY_TIM} ngày gần nhất: ${thay.length} gói</div>` +
      (thay.map(({ g, n }) => mucGoi(g, !dt && khoa(g) === chon, n)).join("") ||
        `<div class="bao khong-thay">Không thấy gói nào khớp "${thoat(chu)}" trong ${SO_NGAY_TIM} ngày gần nhất.</div>`) +
      (hong ? `<div class="bao loi">${hong} ngày không tải được — kết quả có thể thiếu. Anh thử tìm lại sau.</div>` : "");
  }
  let henTim;
  function capNhatTim() {
    if (docHash().xem === "chon") return locTim();
    if ($("tim").value.trim()) return timMoiNgay();
    lanTim++;
    daTai = null;
    tai();
  }
  // Tự đổi ngày = muốn xem ngày đó → bỏ chữ tìm.
  function boTim() { $("tim").value = ""; lanTim++; }

  // ── Cột phải: chi tiết một gói
  function nutPhanHoi(g, { gon = false } = {}) {
    const p = g.phan_hoi;
    const nut = Object.entries(TEN_PH).filter(([k]) => !gon || k !== "may_sai")
      .map(([k, t]) => `<button data-loai="${k}" class="${p?.loai === k ? "chon" : ""}">${t}</button>`).join("");
    return `<div class="ph" data-goi="${thoat(khoa(g))}">${nut}
      ${gon ? "" : `<input placeholder="Ghi chú (bấm Máy sai thì ghi máy sai chỗ nào)" value="${thoat(p?.ghi_chu ?? "")}">`}
      <div class="tt">${p ? `Đã chọn ${thoat(TEN_PH[p.loai])} lúc ${thoat(ddmm(lucVN(p.luc)))} ${thoat(lucVN(p.luc).slice(11, 16))}${p.nguon === "claude" ? " (qua Claude)" : ""}${p.ghi_chu ? ` — ${thoat(p.ghi_chu)}` : ""}` : ""}</div>
    </div>`;
  }

  function bangKiem(du, { chiLoi }) {
    const bk = du.bang_kiem;
    if (!bk) return "";
    let h = `<table class="kt"><tr><th>Yêu cầu của gói</th>${bk.cong_ty.map((c) => `<th>${thoat(c)}</th>`).join("")}</tr>`;
    for (const d of bk.dong) {
      if (chiLoi && !d.o.some((x) => x.dau === "❌" || x.dau === "❓")) continue;
      const nv = d.nguyen_van;
      const anh = /^https:\/\//.test(nv?.anh?.url ?? "") ? nv.anh.url : null;
      const nvHtml = nv
        ? `<details class="nv"><summary>Xem nguyên văn trong hồ sơ</summary><div class="trich">${thoat(nv.trich)}\n<span class="meta">${thoat(nv.vi_tri)}</span></div>${anh ? `<a href="${thoat(anh)}" target="_blank" rel="noopener"><img loading="lazy" alt="Ảnh chụp hồ sơ" src="${thoat(anh)}"></a>` : ""}</details>`
        : "";
      h += `<tr><td>${thoat(d.nhan)}${nvHtml}</td>${d.o.map((x, i) =>
        `<td class="o" tabindex="0" role="button" data-hang="${thoat(d.hang)}" data-i="${i}" data-ct="${thoat(bk.cong_ty[i])}"><span class="${LOP_DAU[x.dau] ?? ""}">${thoat(x.dau)}</span> ${thoat(x.chu)}</td>`).join("")}</tr>
        <tr class="giai-dong" data-hang="${thoat(d.hang)}" hidden><td colspan="${bk.cong_ty.length + 1}"></td></tr>`;
    }
    h += `</table>`;
    if (bk.ghi_chu) h += `<div class="ghi">${thoat(bk.ghi_chu)}</div>`;
    return `<div class="kt-khung">${h}</div>`;
  }

  /** Bấm một ô: câu vì sao / việc cần xem, bảng con nhóm hàng, phép tính, dòng Sheet đã dùng — đều do cổng soạn. */
  function giaiThich(o) {
    let h = `<b>${thoat(o.cong_ty)}</b>${o.cau ? `: ${thoat(o.cau)}` : ""}`;
    if (o.nhom_hang?.length) {
      h += `<table class="con"><tr><th>Nhóm hàng</th><th>Gói cần (1 hợp đồng)</th><th>Hợp đồng tốt nhất của ${thoat(o.cong_ty)}</th><th></th></tr>${
        o.nhom_hang.map((n) => `<tr><td>${thoat(n.ten)}</td><td>${thoat(n.can)}</td><td>${n.tot_nhat ? thoat(n.tot_nhat) : '<span class="meta">không có</span>'}</td><td>${thoat(n.dau)}</td></tr>`).join("")}</table>`;
    }
    if (o.phep_tinh) h += `<div class="${o.nhom_hang?.length ? "ng" : ""}">${thoat(o.phep_tinh)}</div>`;
    if (o.nguon?.length) {
      h += `<div class="ng">Số lấy từ Sheet năng lực: ${o.nguon.slice(0, 6).map((n) =>
        `tab ${thoat(n.tab)} dòng ${thoat(n.dong)} (${thoat(n.cot.replace(/\s*\(VND\)|\s*cả VAT/g, ""))}: ${thoat(n.gia_tri || "trống")})`).join(" · ")}${o.nguon.length > 6 ? ` · và ${o.nguon.length - 6} ô nữa` : ""}</div>`;
    }
    return `<div class="giai">${h}</div>`;
  }

  // AI đánh giá hợp đồng tương tự (ticket 14): nâng → một dòng đã là "AI đánh giá: …"; không nâng → gợi ý.
  // "Xem đầy đủ" = toàn văn AI + ghi chú máy soát số.
  function khoiAi(a) {
    if (!a) return "";
    // Gói đã nâng mà lần AI xét lại nói khác → giữ nhãn (AI không hạ gói) + hiện ý mới để anh biết.
    const xetLai = a.nang && a.ket_luan !== "dat" && a.ket_luan !== "dat_lien_danh";
    const dau = a.nang
      ? `<span class="chip ai">AI đánh giá</span>${xetLai ? `<div class="goi-y-ai">AI xét lại: ${thoat(a.mot_dong)}</div>` : ""}`
      : `<div class="goi-y-ai">Gợi ý AI: ${thoat(a.mot_dong)}</div>`;
    const soat = a.soat?.length ? `<div class="meta">Máy soát số: ${a.soat.map(thoat).join(" · ")}</div>` : "";
    return `<div class="khoi-ai">${dau}<details class="ban-cu"><summary>Xem đầy đủ AI đánh giá</summary>${soat}
      <div class="toan-van">${thoat(a.toan_van ?? "")}</div></details></div>`;
  }

  // Nút "Nhờ AI xem gói này" (ticket 21): đang đọc → khóa; hết lượt → mờ + câu lời thường của cổng thầu.
  function nutAi(du) {
    const n = du.nut_ai;
    if (!n) return "";
    const khoa = `${du.goi.ma_tbmt}-${du.goi.phien_ban}`;
    return `<div class="nut-ai" data-goi="${thoat(khoa)}"><button ${n.dang_doc || !n.con_luot ? "disabled" : ""}>${n.dang_doc ? "AI đang đọc…" : "Nhờ AI xem gói này"}</button><span class="tt">${thoat(n.cau ?? "")}</span></div>`;
  }

  // AI đang đọc gói đang mở → 30 giây tải lại chi tiết một lần, AI ghi xong thì vẽ bản mới (tối đa ~15 phút).
  const dangCho = new Set(); // gói đang có hẹn giờ chờ AI — không đặt hẹn thứ hai
  function choAi(kh, lan = 0) {
    if (lan === 0 && dangCho.has(kh)) return;
    dangCho.add(kh);
    setTimeout(async () => {
      if (dangMo !== kh) return dangCho.delete(kh);
      const [, ma, pb] = kh.match(/^(.+)-(\d{2})$/);
      try {
        const du = await goiCong(`/goi?ma=${encodeURIComponent(ma)}&pb=${encodeURIComponent(pb)}`);
        if (dangMo !== kh) return dangCho.delete(kh);
        chiTiet[kh] = du;
        if (du.nut_ai?.dang_doc && lan < 32) return choAi(kh, lan + 1);
        // AI ghi xong (hoặc cổng thầu thôi chờ sau 15 phút) → vẽ lại danh sách (nhóm của gói có thể đã đổi
        // vì AI nâng) + chi tiết từ bản vừa tải.
        dangCho.delete(kh);
        boNho.clear();
        daTai = null;
        tai();
      } catch {
        if (lan < 32) choAi(kh, lan + 1);
        else dangCho.delete(kh);
      }
    }, 30_000);
  }

  function veChiTiet(du) {
    const g = du.goi;
    const k = du.nhom_hien_thi ?? "can_xem";
    const dt = laDienThoai();
    const tai = du.tai_file?.mo_ta ? ` · ${thoat(du.tai_file.mo_ta)}` : "";
    $("ct").innerHTML = `<button class="dong-x" id="dong-ct">Đóng ✕</button>
      <span class="chip ${k}">${TEN_NHOM[k]}</span>${g.phien_ban !== "00" ? ` <span class="sua">sửa đổi ${thoat(g.phien_ban)}</span>` : ""}
      <div class="ten-goi">${thoat(g.ten)}</div>
      <div class="meta">${[g.ma_tbmt, g.ben_moi].filter(Boolean).map(thoat).join(" · ")} · ${thoat(noi(g) || "không ghi nơi")} · ${gia(g)} · ${han(g)}</div>
      <div class="mot-dong ${k}">${thoat(du.mot_dong ?? "Máy chưa đọc xong gói này")}</div>
      ${du.sua_doi ? `<div class="sua-doi ${du.sua_doi.co_do ? "co-do" : ""}">${du.sua_doi.co_do ? "🚩 " : ""}${thoat(du.sua_doi.cau)}</div>` : ""}
      ${nutPhanHoi({ ...g, phan_hoi: du.phan_hoi })}
      ${khoiAi(du.danh_gia_ai)}
      ${nutAi(du)}
      ${bangKiem(du, { chiLoi: dt })}
      ${dt && du.bang_kiem ? `<div class="ghi">Xem nguyên văn hồ sơ và ảnh chụp: mở trên máy tính.</div>` : ""}
      ${du.ban_cu ? `<details class="ban-cu"><summary>Bản trước (lần ${thoat(du.ban_cu.phien_ban)}): ${thoat(TEN_NHOM[du.ban_cu.nhom_hien_thi] ?? "")}</summary>
        <div class="meta">${thoat(du.ban_cu.mot_dong ?? "")}</div>${bangKiem({ bang_kiem: du.ban_cu.bang_kiem }, { chiLoi: dt })}</details>` : ""}
      <div class="ghi"><a href="${thoat(linkHoSo(g))}" target="_blank" rel="noopener">Mở hồ sơ trên muasamcong</a>${tai}</div>`;
    $("ct").classList.remove("trong");
    $("ct").scrollTop = 0;
  }

  async function moGoi(kh) {
    dangMo = kh;
    const ct = $("ct");
    if (!kh) { ct.classList.add("trong"); ct.innerHTML = `<div class="meta">Chọn một gói bên trái.</div>`; return; }
    for (const m of document.querySelectorAll(".muc")) m.classList.toggle("chon", m.dataset.goi === kh);
    if (!chiTiet[kh]) {
      ct.classList.remove("trong");
      ct.innerHTML = `<button class="dong-x" id="dong-ct">Đóng ✕</button><div class="bao">Đang tải…</div>`;
      const [, ma, pb] = kh.match(/^(.+)-(\d{2})$/) ?? [];
      try {
        chiTiet[kh] = await goiCong(`/goi?ma=${encodeURIComponent(ma)}&pb=${encodeURIComponent(pb)}`);
      } catch (e) {
        if (dangMo !== kh) return; // lỗi của gói cũ — anh đã bấm sang gói khác
        ct.innerHTML = `<button class="dong-x" id="dong-ct">Đóng ✕</button><div class="bao loi">Không tải được: ${thoat(e.message)}</div>`;
        return;
      }
      if (dangMo !== kh) return; // trong lúc tải, anh đã bấm sang gói khác
    }
    veChiTiet(chiTiet[kh]);
    if (chiTiet[kh].nut_ai?.dang_doc) choAi(kh);
  }

  // ── Tải theo hash
  let daTai = null; // "ngay|xem" của danh sách đang vẽ — đổi gói không tải lại danh sách
  let lanTai = 0;   // bấm đổi ngày liên tục: chỉ kết quả của lần tải mới nhất được vẽ
  async function tai() {
    const { ngay, k, xem, goi } = docHash();
    const chon = xem === "chon";
    $("tab-ngay").setAttribute("aria-selected", String(!chon));
    $("tab-chon").setAttribute("aria-selected", String(chon));
    $("chon-ngay-hang").hidden = chon;
    const ds = $("ds");
    if (!k) { ds.innerHTML = `<div class="bao loi">Link thiếu mã. Mở lại link trong tin Telegram.</div>`; return; }
    const n = ngay || homNayVN();
    $("chon-ngay").value = n;
    // Đang tìm mọi ngày: cột trái là kết quả tìm, giữ nguyên khi mở gói (kể cả gói ở ngày khác).
    if (!chon && $("tim").value.trim()) {
      if (daTai !== "tim") await timMoiNgay();
      await moGoi(goi ?? null);
      return;
    }
    const khoaDs = `${chon ? "chon" : n}`;
    if (daTai !== khoaDs) {
      const lan = ++lanTai;
      ds.innerHTML = `<div class="bao">Đang tải…</div>`;
      try {
        if (chon) {
          const du = await goiCong("/da-chon");
          if (lan !== lanTai) return;
          dsGoi = du.goi;
          const dt = laDienThoai();
          ds.innerHTML = `<div class="tomtat">Đã chọn làm: ${du.goi.length} gói</div>` +
            (du.goi.map((g) => mucGoi(g, !dt && khoa(g) === goi)).join("") || `<div class="bao">Chưa chọn gói nào.</div>`);
        } else {
          const du = await goiCong(`/bang?ngay=${n}`);
          if (lan !== lanTai) return;
          dsGoi = veDanhSach(du);
        }
        daTai = khoaDs;
        locTim();
      } catch (e) {
        if (lan !== lanTai) return;
        ds.innerHTML = `<div class="bao loi">Không tải được: ${thoat(e.message)}</div>`;
        daTai = null;
        return;
      }
    }
    // Máy tính: chưa chọn gói thì mở gói đầu (Nên làm, rồi Cần anh xem). Điện thoại: chỉ mở khi bấm.
    const mo = goi ?? (laDienThoai() ? null : (dsGoi[0] ? khoa(dsGoi[0]) : null));
    await moGoi(mo);
  }

  // ── Sự kiện
  document.addEventListener("click", async (e) => {
    // Làm / Bỏ / Máy sai (ở chi tiết hoặc ở thẻ gói trên điện thoại).
    const b = e.target.closest(".ph button");
    if (b) {
      e.stopPropagation();
      const khung = b.closest(".ph");
      const kh = khung.dataset.goi;
      const [, ma, pb] = kh.match(/^(.+)-(\d{2})$/);
      // Thẻ gói trên điện thoại không có ô ghi chú → giữ ghi chú đã có, không xóa mất.
      const ghi_chu = khung.querySelector("input")?.value ??
        (chiTiet[kh]?.phan_hoi ?? dsGoi.find((x) => khoa(x) === kh)?.phan_hoi)?.ghi_chu ?? "";
      const tt = khung.querySelector(".tt");
      if (b.dataset.loai === "may_sai" && !ghi_chu.trim()) {
        tt.className = "tt loi"; tt.textContent = "Máy sai: anh ghi vào ô bên cạnh máy sai chỗ nào rồi bấm lại.";
        khung.querySelector("input")?.focus();
        return;
      }
      for (const x of khung.querySelectorAll("button")) x.disabled = true;
      try {
        const { phan_hoi } = await goiCong("/phan-hoi", { ma_tbmt: ma, phien_ban: pb, loai: b.dataset.loai, ghi_chu });
        const g = dsGoi.find((x) => khoa(x) === kh);
        if (g) g.phan_hoi = phan_hoi;
        if (chiTiet[kh]) chiTiet[kh].phan_hoi = phan_hoi;
        for (const k of document.querySelectorAll(`.ph[data-goi="${CSS.escape(kh)}"]`)) {
          const gon = !k.querySelector("input");
          k.outerHTML = nutPhanHoi({ ma_tbmt: ma, phien_ban: pb, phan_hoi }, { gon });
        }
        if (docHash().xem === "chon") daTai = null; // danh sách Đã chọn làm đổi
      } catch (err) {
        tt.className = "tt loi"; tt.textContent = err.message;
        for (const x of khung.querySelectorAll("button")) x.disabled = false;
      }
      return;
    }
    const nai = e.target.closest(".nut-ai button");
    if (nai) {
      const khung = nai.closest(".nut-ai");
      const kh = khung.dataset.goi;
      const [, ma, pb] = kh.match(/^(.+)-(\d{2})$/);
      const tt = khung.querySelector(".tt");
      nai.disabled = true;
      try {
        const r = await goiCong("/goi/nho-ai", { ma, pb });
        nai.textContent = "AI đang đọc…";
        tt.textContent = r.cau;
        if (chiTiet[kh]) chiTiet[kh].nut_ai = { ...chiTiet[kh].nut_ai, dang_doc: true, cau: r.cau };
        choAi(kh);
      } catch (err) {
        tt.textContent = err.message;
        nai.disabled = false;
      }
      return;
    }
    if (e.target.closest("#dong-ct")) { datHash({ goi: "" }); return; }
    const m = e.target.closest(".muc");
    if (m && !e.target.closest("input")) { datHash({ goi: m.dataset.goi, ...(m.dataset.ngay ? { ngay: m.dataset.ngay } : {}) }); return; }
    // Bấm một ô bảng kiểm → mở / đóng dòng giải thích ngay dưới.
    const td = e.target.closest("td.o");
    if (td) {
      const dong = td.closest("tr").nextElementSibling;
      const oDangMo = td.classList.contains("mo");
      td.closest("tr").querySelectorAll("td.o").forEach((x) => x.classList.remove("mo"));
      if (oDangMo) { dong.hidden = true; return; }
      const du = chiTiet[dangMo];
      // Ô trong khung "Bản trước" (gói sửa đổi) tra bảng kiểm của bản trước.
      const bk = td.closest("details.ban-cu") ? du?.ban_cu?.bang_kiem : du?.bang_kiem;
      const o = bk?.dong.find((d) => d.hang === td.dataset.hang)?.o[+td.dataset.i];
      if (!o) return;
      td.classList.add("mo");
      dong.hidden = false;
      dong.firstElementChild.innerHTML = giaiThich(o);
    }
  });
  // Bàn phím: Enter / dấu cách trên gói hoặc ô bảng kiểm = bấm.
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".muc, td.o")) { e.preventDefault(); e.target.click(); }
  });
  $("tab-ngay").onclick = () => datHash({ xem: "", goi: "" });
  $("tab-chon").onclick = () => datHash({ xem: "chon", goi: "" });
  $("truoc").onclick = () => boTim() || datHash({ ngay: congNgay($("chon-ngay").value || homNayVN(), -1), goi: "" });
  $("sau").onclick = () => boTim() || datHash({ ngay: congNgay($("chon-ngay").value || homNayVN(), 1), goi: "" });
  $("chon-ngay").onchange = (e) => e.target.value && (boTim() || datHash({ ngay: e.target.value, goi: "" }));
  $("tim").oninput = () => { clearTimeout(henTim); henTim = setTimeout(capNhatTim, 300); };
  addEventListener("hashchange", tai);
  // Đổi cỡ màn hình qua mốc 720px → vẽ lại (nhóm thu gọn và bảng kiểm khác nhau giữa hai bản).
  matchMedia("(max-width: 720px)").addEventListener("change", () => { daTai = null; tai(); });
  tai();
</script>
</body>
</html>
